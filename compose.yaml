version: '3.8'

services:
  # 1. Backend Node.js / Express API kết nối trực tiếp MongoDB Atlas
  backend:
    build: ./backend
    container_name: app_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000

  # 2. Frontend React / Vite (Dùng Nginx phục vụ file tĩnh siêu mượt)
  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: always
    ports:
      - "5001:80"
    depends_on:
      - backend